name: AbdoPS5 Build, Test & Package

on:
  push:
    branches: [main, main-with-all-fixes]
  pull_request:
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"
  KYTY_BUILD_ORIGIN: "Fork"
  KYTY_BUILD_REPOSITORY: ${{ github.repository }}

jobs:
  metadata:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Generate release tag
        id: tag
        shell: bash
        run: echo "value=AbdoPS5-$(date -u +'%Y-%m-%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  windows:
    name: Build + Test + Package (Windows x64)
    needs: metadata
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          # vcpkg is pre-installed on windows-2022 runners
          $vcpkgExe = (Get-Command vcpkg -ErrorAction SilentlyContinue).Source
          if (-not $vcpkgExe) {
            # Try common locations
            $vcpkgExe = "C:\vcpkg\vcpkg.exe"
            if (-not (Test-Path $vcpkgExe)) {
              $vcpkgExe = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
            }
          }
          $vcpkgRoot = Split-Path $vcpkgExe
          Write-Host "vcpkg root: $vcpkgRoot"
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            & "$vcpkgRoot\vcpkg.exe" install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify toolchain
        shell: cmd
        run: |
          git --version
          cmake --version
          ninja --version
          clang-cl --version
          glslangValidator --version
          echo Qt6_DIR=%Qt6_DIR%

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -S . -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_BUILD_ORIGIN=%KYTY_BUILD_ORIGIN% ^
            -DKYTY_BUILD_REPOSITORY=%KYTY_BUILD_REPOSITORY% ^
            -DKYTY_RELEASE_TAG=${{ needs.metadata.outputs.release_tag }} ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build emulator + launcher + tests
        shell: cmd
        run: |
          cmake --build _Build/windows ^
            --target kyty_emulator launcher audio_out2_port_tests ime_dialog_tests virtual_memory_allocation_tests iommu_tests haptic_tests tmr_tests screenshot_tests ^
            --parallel

      - name: Run tests
        shell: cmd
        run: |
          ctest --test-dir _Build/windows --output-on-failure ^
            -R "^(audio_out2_port|ime_dialog|virtual_memory_allocation|iommu_tests|haptic_tests|tmr_tests|screenshot_tests)$"

      - name: Run shader coverage check (Kyty-008)
        shell: pwsh
        run: python scripts/check_kyty_shader_coverage.py --verbose
        continue-on-error: true

      - name: Build standalone tools
        shell: cmd
        run: |
          cmake --build _Build/windows --target kytyps5_elf_info kytyps5_nids kytyps5_param_sfo kytyps5_pkg_inspect --parallel
        continue-on-error: true

      - name: Install (collect all binaries + data)
        shell: cmd
        run: |
          cmake --install _Build/windows --prefix _Build/windows/install

      - name: Copy data + scripts + tools
        shell: pwsh
        run: |
          $installDir = "_Build/windows/install"
          if (Test-Path "data") {
            Copy-Item -Path "data" -Destination "$installDir/data" -Recurse -Force
          }
          # Tools are already installed by CMake's install(TARGETS) to
          # $installDir/ (TOOLS_INSTALL_DIR="."). Move them into a tools/
          # subdir for cleanliness. Use Move-Item (not Copy-Item) to
          # avoid the 'cannot overwrite with itself' error that occurs
          # when Get-ChildItem -Recurse finds both the source and dest.
          New-Item -ItemType Directory -Force -Path "$installDir/tools"
          Get-ChildItem -Path "$installDir" -Filter "kytyps5-*.exe" | ForEach-Object { Move-Item $_.FullName "$installDir/tools/" -Force }
          if (Test-Path "scripts") {
            New-Item -ItemType Directory -Force -Path "$installDir/scripts"
            Copy-Item -Path "scripts/*.py" -Destination "$installDir/scripts/" -Force
          }

      - name: Create Windows installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress 2>$null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc packaging/windows/AbdoPS5.iss
            if (Test-Path "AbdoPS5-Setup-0.1.0-x64.exe") {
              $installerSize = [math]::Round((Get-Item "AbdoPS5-Setup-0.1.0-x64.exe").Length / 1MB, 1)
              Write-Host "Created AbdoPS5-Setup-0.1.0-x64.exe ($installerSize MB)"
              Move-Item "AbdoPS5-Setup-0.1.0-x64.exe" "_Build/windows/install/" -Force
            }
          } else {
            Write-Host "Inno Setup not found — skipping installer creation"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbdoPS5-Windows-x64
          path: _Build/windows/install/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: _Build/windows/
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Build + Test + Package (Linux x64)
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build \
            libsdl2-dev libvulkan-dev libfreetype-dev \
            nlohmann-json3-dev libfmt-dev libxxhash-dev \
            libmagic-dev glslang-tools spirv-tools \
            qt6-base-dev qt6-base-dev-tools \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libbz2-dev liblzma-dev \
            libxtst-dev libx11-dev libxext-dev libwayland-dev libxkbcommon-dev 2>&1 || \
          sudo apt-get install -y \
            clang cmake ninja-build \
            libsdl2-dev libvulkan-dev libfreetype-dev \
            nlohmann-json3-dev libfmt-dev libxxhash-dev \
            libmagic-dev libglslang-dev libspirv-dev \
            qt6-base-dev qt6-base-dev-tools \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libbz2-dev liblzma-dev \
            libxtst-dev libx11-dev libxext-dev libwayland-dev libxkbcommon-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify toolchain
        shell: bash
        run: |
          clang++ --version
          cmake --version
          ninja --version
          glslangValidator --version

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B _Build/linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DKYTY_BUILD_ORIGIN="$KYTY_BUILD_ORIGIN" \
            -DKYTY_BUILD_REPOSITORY="$KYTY_BUILD_REPOSITORY" \
            -DKYTY_RELEASE_TAG="${{ needs.metadata.outputs.release_tag }}" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build emulator + launcher + tests
        shell: bash
        run: |
          cmake --build _Build/linux \
            --target kyty_emulator launcher audio_out2_port_tests ime_dialog_tests virtual_memory_allocation_tests iommu_tests haptic_tests tmr_tests screenshot_tests \
            --parallel $(nproc)

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir _Build/linux --output-on-failure \
            -R '^(audio_out2_port|ime_dialog|virtual_memory_allocation|iommu_tests|haptic_tests|tmr_tests|screenshot_tests)$'

      - name: Run shader coverage check (Kyty-008)
        shell: bash
        run: python3 scripts/check_kyty_shader_coverage.py --verbose
        continue-on-error: true

      - name: Build standalone tools
        shell: bash
        run: |
          cmake --build _Build/linux --target kytyps5_elf_info kytyps5_nids kytyps5_param_sfo kytyps5_pkg_inspect --parallel
        continue-on-error: true

      - name: Install + create ZIP
        shell: bash
        run: |
          cmake --install _Build/linux --prefix _Build/linux/install
          cp -r data _Build/linux/install/ 2>/dev/null || true
          cp -r scripts _Build/linux/install/ 2>/dev/null || true
          mkdir -p _Build/linux/install/tools
          find _Build/linux -maxdepth 2 \( -name "kytyps5-elf-info" -o -name "kytyps5-nids" -o -name "kytyps5-param-sfo" -o -name "kytyps5-pkg-inspect" \) | xargs -I{} cp {} _Build/linux/install/tools/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE/_Build/linux/install
          cd $GITHUB_WORKSPACE
          ls -lh _Build/linux/install/

      - name: Create Linux AppImage
        shell: bash
        continue-on-error: true
        run: |
          chmod +x packaging/linux/create-appimage.sh
          bash packaging/linux/create-appimage.sh _Build/linux/install _Build/linux/install/AbdoPS5-Linux-x64.AppImage || true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbdoPS5-Linux-x64
          path: _Build/linux/install/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux
          path: _Build/linux/
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: Build + Test + Package (macOS x64)
    needs: metadata
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        shell: bash
        run: |
          xcode_path="$(ls -d /Applications/Xcode_26*.app | tail -n 1)"
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Install build dependencies
        shell: bash
        run: brew install glslang

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B _Build/macos \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DKYTY_BUILD_ORIGIN="$KYTY_BUILD_ORIGIN" \
            -DKYTY_BUILD_REPOSITORY="$KYTY_BUILD_REPOSITORY" \
            -DKYTY_RELEASE_TAG="${{ needs.metadata.outputs.release_tag }}" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build emulator + launcher + tests
        shell: bash
        run: |
          cmake --build _Build/macos \
            --target kyty_emulator launcher audio_out2_port_tests ime_dialog_tests virtual_memory_allocation_tests iommu_tests haptic_tests tmr_tests screenshot_tests kytyps5_elf_info kytyps5_nids kytyps5_pkg_inspect kytyps5_param_sfo \
            --parallel

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir _Build/macos --output-on-failure \
            -R '^(audio_out2_port|ime_dialog|virtual_memory_allocation|iommu_tests|haptic_tests|tmr_tests|screenshot_tests)$'

      - name: Install
        shell: bash
        run: cmake --install _Build/macos --prefix _Build/macos/install

      - name: Bundle MoltenVK
        shell: bash
        env:
          MOLTENVK_VERSION: v1.4.2
          MOLTENVK_SHA256: f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e
        run: |
          archive="$RUNNER_TEMP/MoltenVK-macos.tar"
          package="$RUNNER_TEMP/MoltenVK"
          install_dir="_Build/macos/install"
          app_dir="$install_dir/KytyPS5.app"
          moltenvk="$install_dir/libMoltenVK.dylib"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-macos.tar"
          echo "$MOLTENVK_SHA256  $archive" | shasum -a 256 --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          test -d "$app_dir"
          install -m 755 \
            "$package/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib" \
            "$moltenvk"
          install -m 644 "$package/LICENSE" "$install_dir/LICENSE.MoltenVK"
          codesign --force --sign - --timestamp=none "$moltenvk"
          install -d -m 755 "$app_dir/Contents/Frameworks" "$app_dir/Contents/Resources"
          install -m 755 "$moltenvk" "$app_dir/Contents/Frameworks/libMoltenVK.dylib"
          install -m 644 "$package/LICENSE" "$app_dir/Contents/Resources/LICENSE.MoltenVK"
          codesign --force --sign - --timestamp=none "$app_dir"

      - name: Verify artifacts
        shell: bash
        run: |
          install_dir="_Build/macos/install"
          app_dir="$install_dir/KytyPS5.app"
          test -d "$app_dir"
          for binary in \
            "$install_dir/kyty_emulator" \
            "$install_dir/libMoltenVK.dylib" \
            "$app_dir/Contents/MacOS/KytyPS5" \
            "$app_dir/Contents/MacOS/kyty_emulator" \
            "$app_dir/Contents/Frameworks/libMoltenVK.dylib"; do
            file "$binary"
            lipo "$binary" -verify_arch x86_64
          done
          for binary in \
            "$install_dir/kyty_emulator" \
            "$install_dir/libMoltenVK.dylib" \
            "$app_dir/Contents/MacOS/KytyPS5" \
            "$app_dir/Contents/MacOS/kyty_emulator" \
            "$app_dir/Contents/Frameworks/libMoltenVK.dylib"; do
            codesign --verify --strict "$binary"
          done
          codesign --verify --deep --strict --verbose=2 "$app_dir"

      - name: Package macOS artifacts
        shell: bash
        run: |
          install_dir="_Build/macos/install"
          archive="$RUNNER_TEMP/AbdoPS5-macOS-x86_64.zip"
          (cd "$install_dir" && zip -qry "$archive" .)
          unzip -t "$archive"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbdoPS5-macOS-x64
          path: ${{ runner.temp }}/AbdoPS5-macOS-x86_64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos
          path: _Build/macos/
          if-no-files-found: ignore
          retention-days: 7

  shader-coverage:
    name: Shader opcode coverage check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check V_CMP_*_U64/I64 opcode coverage
        run: python3 scripts/check_kyty_shader_coverage.py --verbose
